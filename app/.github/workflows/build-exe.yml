name: Build SentiAir.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:       # ← lets you trigger it manually from GitHub UI

jobs:
  build:
    runs-on: windows-latest   # ← must be Windows to produce a .exe

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller sentiair.spec

      - name: Upload SentiAir.exe as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentiAir-Windows
          path: dist/SentiAir.exe
          retention-days: 30
