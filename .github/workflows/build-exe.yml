name: Build SentiAir.exe

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask scikit-learn nltk numpy joblib scipy threadpoolctl pyinstaller

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SentiAir" `
            --add-data "app/templates;app/templates" `
            --add-data "app/static;app/static" `
            --add-data "models;models" `
            --add-data "data;data" `
            --hidden-import sklearn `
            --hidden-import sklearn.svm `
            --hidden-import sklearn.svm._classes `
            --hidden-import sklearn.svm._base `
            --hidden-import sklearn.feature_extraction.text `
            --hidden-import sklearn.naive_bayes `
            --hidden-import sklearn.ensemble `
            --hidden-import sklearn.ensemble._forest `
            --hidden-import sklearn.preprocessing `
            --hidden-import sklearn.preprocessing._label `
            --hidden-import sklearn.pipeline `
            --hidden-import sklearn.metrics `
            --hidden-import sklearn.utils `
            --hidden-import sklearn.utils.validation `
            --hidden-import sklearn.utils._bunch `
            --hidden-import sklearn.utils._param_validation `
            --hidden-import nltk `
            --hidden-import nltk.tokenize `
            --hidden-import nltk.corpus `
            --hidden-import nltk.stem `
            --hidden-import nltk.stem.porter `
            --hidden-import joblib `
            --hidden-import scipy `
            --hidden-import scipy.sparse `
            --hidden-import scipy.sparse._compressed `
            --hidden-import scipy.sparse._csr `
            --hidden-import threadpoolctl `
            --collect-all sklearn `
            --collect-all nltk `
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentiAir-Windows
          path: dist/SentiAir.exe
          retention-days: 30
